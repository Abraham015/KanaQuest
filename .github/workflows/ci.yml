name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    working-directory: kanaquest

jobs:
  quality:
    name: Typecheck, Test, Build, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kanaquest/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: node --check netlify/functions/contact.js
      - run: npm run audit:production

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: kanaquest/coverage
          if-no-files-found: ignore
